name: PyQuest quality loop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install numpy pandas matplotlib scipy scikit-learn seaborn
      - run: npm run curriculum
      - run: git diff --exit-code -- src/content/curriculum.json
      - run: python scripts/audit_curriculum.py --runtime
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results
          retention-days: 7
